<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my diary ♡</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="diary-page">

        <div class="diary-heading">
            <a href="index.html">♡ back home</a>
            <h1>my diary</h1>
            <p>a little book of thoughts & memories</p>
        </div>

        <div class="journal">

            <div class="book">

              <div class="page left-page">
    <div class="paper">
        <span class="sticker sticker-left">🌸</span>
    </div>
</div>

<div class="page right-page">
    <div class="paper">
        <span class="sticker sticker-right">🦋</span>
    </div>
</div>

              <div class="turning-page">

    <div class="paper front">
        <span class="sticker sticker-right">🎀</span>
    </div>

    <div class="paper back">
        <span class="sticker sticker-left">🌷</span>
    </div>

</div>


            </div>

        </div>

        <p class="turn-hint">
            click the right page to turn ♡
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
